version: "3.8"

services:
  socket_proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    environment:
      # Permissões mínimas para o Traefik
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      NODES: 1
      SYSTEM: 1
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
    cap_drop:
      - ALL

  traefik:
    image: traefik:latest@sha256:c8a121e4bb1347e8fd52657fab12f2cb70b68f8a018895e2068f92c9e519b9c2
    command: ["--configFile=/etc/traefik/traefik.yml"]
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
      ACME_EMAIL: ${ACME_EMAIL}
      TRAEFIK_DOMAIN: ${TRAEFIK_DOMAIN}
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-acme:/etc/traefik/acme
      - traefik-logs:/var/log/traefik
    secrets:
      - cloudflare_api_token
    networks:
      socket_proxy:
      traefik-public:
        aliases:
          - traefik.${TRAEFIK_DOMAIN}
      traefik-local:
      traefik_local_lan:
    deploy:
      mode: global
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.hostname == pyuserver
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      update_config:
        order: stop-first
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    cap_add:
      - NET_BIND_SERVICE
    cap_drop:
      - ALL

networks:
  traefik-public:
    external: true
  traefik-local:
    external: true
  traefik_local_lan:
    external: true
  socket_proxy:
    driver: overlay
    internal: true
    attachable: false

secrets:
  cloudflare_api_token:
    external: true

volumes:
  traefik-acme:
    driver: local
  traefik-logs:
    driver: local

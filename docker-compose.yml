version: "3.8"

services:
  socket_proxy:
    image: tecnativa/docker-socket-proxy
    environment:
      # Permissões mínimas para o Traefik
      CONTAINERS: 1
      SERVICES: 1
      TASKS: 1
      NETWORKS: 1
      NODES: 1
      SYSTEM: 1
      LOG_LEVEL: info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - socket_proxy
    deploy:
      mode: global
      placement:
        constraints:
          - node.role == manager  # Apenas managers executam o proxy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    cap_drop:
      - ALL
  traefik:
    image: traefik:latest
    command:
      - "sh"
      - "-c"
      - "mkdir -p /etc/traefik/acme && touch /etc/traefik/acme/acme.json && chmod 600 /etc/traefik/acme/acme.json && exec traefik --configFile=/etc/traefik/traefik.yml"
    environment:
      - CF_DNS_API_TOKEN_FILE=/run/secrets/cloudflare_api_token
      - ACME_EMAIL=${ACME_EMAIL}
      - TRAEFIK_DOMAIN=${TRAEFIK_DOMAIN}
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-acme:/etc/traefik/acme
      - ./infra/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-logs:/var/log/traefik
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - cloudflare_api_token
    networks:
      socket_proxy:
      traefik-public:
        aliases:
          - traefik.${TRAEFIK_DOMAIN}
      traefik-local:
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
      - target: 8181
        published: 8181
        protocol: tcp
        mode: ingress
    cap_drop:
      - ALL

networks:
  traefik-public:
    external: true
  traefik-local:
    external: true
  socket_proxy:
    driver: overlay
    internal: true
    attachable: false
secrets:
  cloudflare_api_token:
    external: true
volumes:
  traefik-acme:
    driver: local
  traefik-logs:
    driver: local

http:
  routers:
    portainer:
      entryPoints:
        - websecure
      rule: "Host(`portainer.${TRAEFIK_DOMAIN}`)"
      middlewares:
        - crowdsec@file
        - authentik-portainer-middleware@file
      service: portainer
      tls:
        certResolver: cloudflare
  
  
    portainer-auth:
      entryPoints:
        - websecure
      rule: Host(`portainer.${TRAEFIK_DOMAIN}`) && PathPrefix(`/outpost.goauthentik.io/`)
      service: authentik-portainer-outpost
      tls:
        certResolver: cloudflare
  
  middlewares:
    authentik-portainer-middleware:
      forwardAuth:
        address: "http://ak-outpost-portainer-outpost:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  services:
    authentik-portainer-outpost:
      loadBalancer:
        servers:
          - url: http://ak-outpost-portainer-outpost:9000/outpost.goauthentik.io
    portainer:
      loadBalancer:
        servers:
          - url: "http://portainer_portainer:9000"
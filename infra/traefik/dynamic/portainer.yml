http:
  routers:
    portainer:
      entryPoints:
        - websecure
      rule: "Host(`portainer.nilvanlopes.com`)"
      middlewares:
        - crowdsec@file
        - authentik-portainer-middleware@file
      service: portainer
      tls:
        certResolver: cloudflare

    portainer-auth:
      entryPoints:
        - websecure
      rule: Host(`portainer.nilvanlopes.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      service: authentik-portainer-outpost
      tls:
        certResolver: cloudflare
  
  middlewares:
    authentik-portainer-middleware:
      forwardAuth:
        address: "http://authentik-outpost-portainer_proxy:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  services:
    authentik-portainer-outpost:
      loadBalancer:
        servers:
          - url: http://authentik-outpost-portainer_proxy:9000/outpost.goauthentik.io
    portainer:
      loadBalancer:
        servers:
          - url: "http://portainer_portainer:9000"

http:
  routers:
    traefik:
      entryPoints:
        - websecure
      rule: Host(`traefik.nilvanlopes.com`)
      middlewares:
        - crowdsec@file
        - authentik-traefik-middleware@file
      service: api@internal
      tls:
        certResolver: cloudflare

    traefik-auth:
      entryPoints:
        - websecure
      rule: Host(`traefik.nilvanlopes.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      service: authentik-traefik-outpost
      tls:
        certResolver: cloudflare

  middlewares:
    authentik-traefik-middleware:
      forwardAuth:
        address: http://authentik-outpost-traefik_proxy:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid
          - X-authentik-jwt

  services:
    authentik-traefik-outpost:
      loadBalancer:
        servers:
          - url: http://authentik-outpost-traefik_proxy:9000/outpost.goauthentik.io

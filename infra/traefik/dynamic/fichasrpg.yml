# O Traefik encaminha o tráfego; a API valida sessão, grupo e dono das fichas.
http:
  routers:

    # Portal, arquivos, cadastro e API. A aplicação valida o acesso aos dados.
    fichasrpg-portal:
      entryPoints:
        - websecure
      rule: Host(`fichasrpg.nilvanlopes.com`)
      priority: 10
      middlewares:
        - crowdsec@file
      service: fichasrpg-portal
      tls:
        certResolver: cloudflare

    # Início, callback e saída da sessão pelo outpost do Authentik.
    fichasrpg-sessao:
      entryPoints:
        - websecure
      rule: Host(`fichasrpg.nilvanlopes.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 200
      middlewares:
        - crowdsec@file
      service: fichasrpg-outpost
      tls:
        certResolver: cloudflare

    # Domínio de login servido pelo Authentik.
    fichasrpg-login:
      entryPoints:
        - websecure
      rule: Host(`login-fichasrpg.nilvanlopes.com`)
      priority: 150
      middlewares:
        - crowdsec@file
        - authentik-headers@swarm
      service: authentik@swarm
      tls:
        certResolver: cloudflare
  services:
    fichasrpg-portal:
      loadBalancer:
        servers:
          - url: http://fichasrpg_web:8080
    fichasrpg-outpost:
      loadBalancer:
        servers:
          - url: http://authentik-outpost-fichasrpg_proxy:9000

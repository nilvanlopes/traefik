http:
  routers:
    fichasrpg-public:
      entryPoints:
        - websecure
      rule: Host(`fichasrpg.nilvanlopes.com`) && (PathPrefix(`/cadastro`) || PathPrefix(`/api/signup`) || Path(`/api/oauth/google/callback`))
      priority: 100
      middlewares:
        - crowdsec@file
      service: fichasrpg
      tls:
        certResolver: cloudflare

    fichasrpg:
      entryPoints:
        - websecure
      rule: Host(`fichasrpg.nilvanlopes.com`) && !PathPrefix(`/cadastro`) && !PathPrefix(`/api/signup`) && !Path(`/api/oauth/google/callback`) && !PathPrefix(`/outpost.goauthentik.io/`)
      priority: 10
      middlewares:
        - crowdsec@file
        - authentik-fichasrpg-middleware@file
      service: fichasrpg
      tls:
        certResolver: cloudflare

    fichasrpg-auth:
      entryPoints:
        - websecure
      rule: Host(`fichasrpg.nilvanlopes.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      priority: 200
      middlewares:
        - crowdsec@file
      service: authentik-fichasrpg-outpost
      tls:
        certResolver: cloudflare

  middlewares:
    authentik-fichasrpg-middleware:
      forwardAuth:
        address: http://authentik-outpost-fichasrpg_proxy:9000/outpost.goauthentik.io/auth/traefik
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

  services:
    fichasrpg:
      loadBalancer:
        servers:
          - url: http://fichasrpg_web:8080
    authentik-fichasrpg-outpost:
      loadBalancer:
        servers:
          - url: http://authentik-outpost-fichasrpg_proxy:9000

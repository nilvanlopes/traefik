http:
  middlewares:
    authentik-n8n-middleware:
      forwardAuth:
        address: "http://authentik-outpost-n8n_proxy:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

    n8n-security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        forceSTSHeader: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin

  routers:
    n8n-auth:
      entryPoints:
        - websecure
      rule: Host(`n8n.nilvanlopes.com`) && PathPrefix(`/outpost.goauthentik.io/`)
      service: authentik-n8n-outpost
      tls:
        certResolver: cloudflare

  services:
    authentik-n8n-outpost:
      loadBalancer:
        servers:
          - url: http://authentik-outpost-n8n_proxy:9000/outpost.goauthentik.io
